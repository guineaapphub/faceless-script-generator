<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Rant Generator</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #39ff14;
      --primary-glow: rgba(57,255,20,0.5);
      --bg-light: #ffffff;
      --bg-dark: #0b0d11;
      --text-light: #1a1a1a;
      --text-dark: #f7f7f7;
      --border: #2c2c2c;
      --card-light: #ffffff;
      --card-dark: #11151c;
    }

    body {
      margin: 0;
      font-family: "Rubik", sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.light { background: var(--bg-light); color: var(--text-light); }
    body.dark { background: var(--bg-dark); color: var(--text-dark); }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    body.dark .top-bar { background: rgba(255,255,255,0.05); }

    .theme-btn {
      border: 1px solid var(--border);
      background: transparent;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .theme-btn:hover { transform: translateY(-1px); }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .panel {
      background: var(--card-light);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    body.dark .panel { background: var(--card-dark); }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font-size: 14px;
      outline: none;
    }

    button {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary { background: var(--primary); color: #000; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: inherit; }

    #output {
      min-height: 120px;
      white-space: pre-wrap;
      padding: 10px;
    }

    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    .status-ok { color: #28a745; font-size: 12px; }
    .status-err { color: #d32f2f; font-size: 12px; }

  </style>
</head>

<body class="light">

<!-- Top Bar -->
<div class="top-bar">
  <div><strong>Roblox Rant Generator</strong></div>
  <button id="themeToggle" class="theme-btn">🌙 Dark</button>
</div>

<div class="container">

  <h1>Roblox Rant Generator</h1>

  <!-- Rant Panel -->
  <div class="panel">
    <label>Topic</label>
    <input id="topicInput" placeholder="school, lag, annoying kids, etc">

    <label>Paste rant to rewrite (optional)</label>
    <textarea id="pasteInput" placeholder="Paste text to rewrite…"></textarea>

    <div class="flex">
      <button class="btn-primary" id="generateBtn">Generate</button>
      <button class="btn-secondary" id="rewriteBtn">Rewrite</button>
      <button class="btn-secondary" id="shuffleBtn">Shuffle</button>
      <button class="btn-secondary" id="uniqueBtn">Make Unique</button>
      <button class="btn-secondary" id="copyBtn">Copy</button>
    </div>
  </div>

  <!-- API Settings -->
  <div class="panel">
    <label>Choose Provider</label>
    <select id="providerSelect">
      <option value="groq">Groq (Llama3-70B)</option>
      <option value="gemini">Google Gemini</option>
    </select>

    <label>API Key</label>
    <input id="apiKeyInput" type="password" placeholder="Enter API key">

    <div class="flex">
      <button class="btn-secondary" id="showKeyBtn">👁</button>
      <button class="btn-secondary" id="saveKeyBtn">Save</button>
      <button class="btn-secondary" id="clearKeyBtn">Clear</button>
    </div>

    <div id="apiStatus" class="status-err">No key saved</div>
  </div>

  <!-- Output -->
  <div class="panel">
    <label>Generated Output</label>
    <div id="output">Your rant will appear here…</div>
  </div>

</div>

<script>
/* ---------------- THEME ---------------- */
const themeBtn = document.getElementById("themeToggle");
function applyTheme(mode) {
  document.body.classList.remove("light","dark");
  document.body.classList.add(mode);
  themeBtn.textContent = mode === "dark" ? "☀️ Light" : "🌙 Dark";
  localStorage.setItem("theme", mode);
}
applyTheme(localStorage.getItem("theme") || "light");
themeBtn.onclick = () =>
  applyTheme(document.body.classList.contains("dark") ? "light" : "dark");


/* ---------------- API STORAGE ---------------- */
const apiKeyInput = document.getElementById("apiKeyInput");
const providerSelect = document.getElementById("providerSelect");
const apiStatus = document.getElementById("apiStatus");

function loadKey() {
  apiKeyInput.value = localStorage.getItem("api-key") || "";
  providerSelect.value = localStorage.getItem("provider") || "groq";
}

loadKey();

document.getElementById("saveKeyBtn").onclick = () => {
  localStorage.setItem("api-key", apiKeyInput.value.trim());
  localStorage.setItem("provider", providerSelect.value);
  apiStatus.textContent = "API key saved.";
  apiStatus.className = "status-ok";
};

document.getElementById("clearKeyBtn").onclick = () => {
  localStorage.removeItem("api-key");
  apiKeyInput.value = "";
  apiStatus.textContent = "API key cleared.";
  apiStatus.className = "status-err";
};

document.getElementById("showKeyBtn").onclick = () => {
  apiKeyInput.type = apiKeyInput.type === "password" ? "text" : "password";
};


/* ---------------- CALL WORKER ---------------- */
async function callWorker(prompt) {
  const apiKey = apiKeyInput.value.trim();
  const provider = providerSelect.value;

  if (!apiKey) {
    apiStatus.textContent = "Enter your API key.";
    apiStatus.className = "status-err";
    return "(No API key)";
  }

  const res = await fetch("https://faceless-rant-proxy.bouncingstephen.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider, apiKey, prompt }),
  });

  if (!res.ok) {
    const text = await res.text();
    apiStatus.textContent = "Error " + res.status;
    apiStatus.className = "status-err";
    console.error("Worker error:", text);
    return "(Error)";
  }

  const data = await res.json();

  if (provider === "groq") {
    return data?.choices?.[0]?.message?.content || "(No response)";
  }

  if (provider === "gemini") {
    return data?.candidates?.[0]?.content?.parts?.[0]?.text || "(No response)";
  }

  return "(Unknown provider)";
}


/* ---------------- BUTTONS ---------------- */
const output = document.getElementById("output");

async function run(mode) {
  const topic = document.getElementById("topicInput").value.trim();
  const paste = document.getElementById("pasteInput").value.trim();

  let prompt = "";

  if (mode === "generate") prompt = "Write a Roblox rant about: " + topic;
  if (mode === "rewrite") prompt = "Rewrite this rant: " + paste;
  if (mode === "shuffle") prompt = "Create a new variation of a rant about: " + topic;
  if (mode === "unique") prompt = "Make this rant more unique: " + paste;

  output.textContent = await callWorker(prompt);
}

document.getElementById("generateBtn").onclick = () => run("generate");
document.getElementById("rewriteBtn").onclick = () => run("rewrite");
document.getElementById("shuffleBtn").onclick = () => run("shuffle");
document.getElementById("uniqueBtn").onclick = () => run("unique");
document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(output.textContent);
};
</script>

</body>
</html>
