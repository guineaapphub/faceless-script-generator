<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Rant Generator</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #39ff14;
      --primary-glow: rgba(57,255,20,0.5);
      --bg-light: #ffffff;
      --bg-dark: #0b0d11;
      --text-light: #0d0d0d;
      --text-dark: #f5f5f5;
      --border: #2d2d2d;
      --card-light: #ffffff;
      --card-dark: #11151c;
      --topbar-bg-light: #f7f7f7;
      --topbar-bg-dark: #05060a;
    }

    body.light {
      background: var(--bg-light);
      color: var(--text-light);
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    body {
      font-family: "Rubik", sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--topbar-bg-light);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    body.dark .top-bar {
      background: var(--topbar-bg-dark);
    }

    .top-right { display: flex; gap: 12px; align-items: center; }

    .theme-mode-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .discord-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .discord-icon-btn svg { width: 18px; height: 18px; fill: #5865f2; }

    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

    h1 {
      text-align: center;
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .subtitle { text-align: center; opacity: 0.85; margin-bottom: 22px; }

    .panel {
      background: var(--card-light);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    body.dark .panel { background: var(--card-dark); }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
      outline: none;
    }
    textarea { min-height: 80px; }

    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary { background: var(--primary); color: black; }
    .btn-secondary { border: 1px solid var(--border); background: transparent; color: inherit; }

    #output { white-space: pre-wrap; min-height: 140px; }
    .api-body { display: none; }
    .api-body.open { display: block; }

    .api-status { font-size: 12px; margin-top: 6px; }
    .ok { color: #2ecc71; }
    .err { color: #e74c3c; }

    .groq-link-btn {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body class="light">

<!-- TOP BAR -->
<div class="top-bar">
  <div>Roblox Rant Generator</div>
  <div class="top-right">
    <button id="themeModeBtn" class="theme-mode-btn">🌙 Dark</button>

    <a class="discord-icon-btn" href="https://discord.gg/Y4GenJXgEn" target="_blank">
      <svg viewBox="0 0 245 240">
        <path d="M104.4 104.9c-5.7 0-10.2 5-10.2 11.1s4.6 11.1 10.2 11.1..." />
      </svg>
    </a>
  </div>
</div>

<div class="container">
  <h1>Roblox Rant Generator</h1>
  <div class="subtitle">Type your theme, build your rant, bye-bye noob.</div>

  <div class="panel">
    <label>Topic / Theme</label>
    <input id="topicInput" type="text" />

    <label>Paste Your Rant Script (optional)</label>
    <textarea id="pasteInput"></textarea>

    <label>Narrator</label>
    <select id="narratorSelect">
      <option value="male">Male</option>
      <option value="neutral">Neutral</option>
      <option value="female">Sassy Female</option>
    </select>

    <label>Intensity</label>
    <input id="intensitySlider" type="range" min="1" max="4" value="2" />

    <label>Length</label>
    <input id="lengthSlider" type="range" min="1" max="4" value="2" />

    <div class="button-row">
      <button id="generateBtn" class="btn-primary">Generate</button>
      <button id="rewriteBtn" class="btn-secondary">Rewrite</button>
      <button id="shuffleBtn" class="btn-secondary">Shuffle</button>
      <button id="punchierBtn" class="btn-secondary">Make Unique</button>
      <button id="copyBtn" class="btn-secondary">Copy</button>
    </div>
  </div>

  <div class="panel">
    <div class="api-header" id="apiHeader">AI Provider & API Key ▼</div>

    <div id="apiBody" class="api-body">
      <label>Choose AI Provider</label>
      <select id="providerSelect">
        <option value="groq">Groq (Llama 3.1 70B)</option>
        <option value="gemini">Google Gemini</option>
      </select>

      <div class="api-row">
        <input id="apiKeyInput" type="password" placeholder="Enter your API key" />
        <button id="toggleKeyBtn" class="btn-secondary">👁</button>
        <button id="saveKeyBtn" class="btn-secondary">Save</button>
        <button id="clearKeyBtn" class="btn-secondary">Clear</button>
      </div>

      <div id="apiStatus" class="api-status">No API key saved.</div>

      <a class="groq-link-btn" href="https://console.groq.com/keys" target="_blank">👉 Get your Groq API Key</a><br>
      <a class="groq-link-btn" href="https://aistudio.google.com/app/apikey" target="_blank">👉 Get your Gemini API Key</a>
    </div>
  </div>

  <div class="panel">
    <label>Generated Rant Script</label>
    <div id="output">Your rant will appear here...</div>
  </div>
</div>

<script>
/* THEME MODE */
const themeBtn = document.getElementById("themeModeBtn");
function applyTheme(mode){
  document.body.className = mode;
  localStorage.setItem("fsg-theme", mode);
  themeBtn.textContent = mode === "dark" ? "🌙 Dark" : "☀️ Light";
}
applyTheme(localStorage.getItem("fsg-theme") || "light");
themeBtn.onclick = () => applyTheme(document.body.classList.contains("dark") ? "light" : "dark");

/* COLLAPSIBLE API PANEL */
const apiHeader = document.getElementById("apiHeader");
const apiBody = document.getElementById("apiBody");
apiHeader.onclick = () => apiBody.classList.toggle("open");

/* API STORAGE */
const apiKeyInput = document.getElementById("apiKeyInput");
const providerSelect = document.getElementById("providerSelect");
const apiStatus = document.getElementById("apiStatus");

function showStatus(msg,type){ apiStatus.textContent = msg; apiStatus.className = "api-status " + (type||""); }

function getProvider(){
  let p = localStorage.getItem("fsg-provider");
  if (!["groq","gemini"].includes(p)){  
    localStorage.setItem("fsg-provider","groq");
    return "groq";
  }
  return p;
}

providerSelect.value = getProvider();
apiKeyInput.value = localStorage.getItem("fsg-user-api-key") || "";

/* TOGGLE KEY VISIBILITY */
toggleKeyBtn.onclick = () => {
  apiKeyInput.type = apiKeyInput.type==="password" ? "text" : "password";
};

/* SAVE KEY */
saveKeyBtn.onclick = () => {
  localStorage.setItem("fsg-user-api-key", apiKeyInput.value);
  localStorage.setItem("fsg-provider", providerSelect.value);
  showStatus("API key saved.","ok");
};

/* CLEAR KEY */
clearKeyBtn.onclick = () => {
  localStorage.removeItem("fsg-user-api-key");
  apiKeyInput.value="";
  showStatus("API key cleared.","err");
};

/* BUILD PROMPT (UNCHANGED FROM YOUR VERSION) */
function buildPrompt(mode){
  const topic=document.getElementById("topicInput").value.trim();
  return `Write a Gen-Z Roblox rant about: ${topic}`;
}

/* CALL WORKER */
async function callAI(prompt){
  const apiKey = localStorage.getItem("fsg-user-api-key");
  const provider = getProvider();

  const res = await fetch("https://faceless-rant-proxy.bouncingstephen.workers.dev",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ provider, apiKey, prompt })
  });

  if(!res.ok){
    showStatus("Error "+res.status,"err");
    throw new Error("AI Request Failed");
  }

  const data = await res.json();
  if(provider==="groq") return data?.choices?.[0]?.message?.content || "";
  if(provider==="gemini") return data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

/* BUTTON ACTIONS */
generateBtn.onclick = async()=> output.textContent = await callAI(buildPrompt("generate"));
rewriteBtn.onclick = async()=> output.textContent = await callAI(buildPrompt("rewrite"));
shuffleBtn.onclick = async()=> output.textContent = await callAI(buildPrompt("shuffle"));
punchierBtn.onclick = async()=> output.textContent = await callAI(buildPrompt("punchier"));

copyBtn.onclick = ()=> navigator.clipboard.writeText(output.textContent);

</script>
</body>
</html>
