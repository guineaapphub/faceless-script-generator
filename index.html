<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roblox Rant Generator</title>

<!-- GOOGLE ADSENSE VERIFICATION -->
<script async 
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6610889405997257"
  crossorigin="anonymous"></script>

<!-- Styles -->
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #111;
  }
  body.dark {
    background: #0d0e12;
    color: white;
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
    font-weight: 800;
    text-shadow: 0 0 8px lime;
  }

  .section {
    background: rgba(0,0,0,0.05);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  body.dark .section {
    background: #1a1d26;
  }

  textarea, input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
  }
  body.dark textarea, body.dark input, body.dark select {
    background: #0f1118;
    border: 1px solid #333;
    color: white;
  }

  button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: #00ff57;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: 0.8; }

  .ads-box {
    width: 100%;
    min-height: 120px;
    margin: 25px 0;
    background: rgba(0,0,0,0.05);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #666;
  }
  body.dark .ads-box {
    background: rgba(255,255,255,0.05);
    color: #aaa;
  }

  .toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    padding: 9px 16px;
    background: #222;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="toggle" id="modeToggle">Dark</div>

<div class="container">
  <h1>Roblox Rant Generator</h1>
  <p style="text-align:center;margin-top:-10px;">Type Your Theme. Create Your Rant. Bye-Bye Noob.</p>

  <!-- TOP BANNER AD -->
  <div class="ads-box">
    <!-- Replace data-ad-slot later when approved -->
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-client="ca-pub-6610889405997257"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="section">
    <label>Topic / Theme</label>
    <input id="topic" placeholder="iphone, pets, teachers, Roblox updates...">
    
    <label style="margin-top:15px;">Opening Line Style</label>
    <select id="style">
      <option>Random (let AI choose style)</option>
      <option>Angry intro</option>
      <option>Calm intro</option>
      <option>Sarcastic intro</option>
    </select>

    <label style="margin-top:15px;">Paste Your Rant Script (optional)</label>
    <textarea id="userScript" rows="6"></textarea>

    <label style="margin-top:15px;">Narrator Style</label>
    <select id="voice">
      <option>Male Narrator</option>
      <option>Female Narrator</option>
      <option>Deep Rage Voice</option>
      <option>Goofy High Pitched Voice</option>
    </select>

    <label style="margin-top:15px;">Rant Meltdown</label>
    <input type="range" id="meltdown" min="0" max="10" value="5">

    <label style="margin-top:15px;">Paragraphs</label>
    <input type="range" id="paragraphs" min="1" max="8" value="3">

    <div style="margin-top:15px;">
      <input type="checkbox" id="slang" checked> Include slang  
      <br>
      <input type="checkbox" id="swearing"> Allow swearing
    </div>

    <button style="margin-top:18px;" onclick="generateRant()">Generate Rant</button>
  </div>

  <!-- MIDDLE AD -->
  <div class="ads-box">
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-client="ca-pub-6610889405997257"
         data-ad-slot="9876543210"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="section">
    <h3>Generated Rant Script</h3>
    <textarea id="output" rows="8"></textarea>
  </div>

  <!-- API KEY SECTION -->
  <div class="section">
    <h3>Groq API Key</h3>
    <input type="password" id="apiKeyInput" placeholder="Enter your Groq API key">

    <div style="margin-top:15px;">
      <button onclick="toggleKey()">Show</button>
      <button onclick="saveKey()">Save</button>
      <button onclick="clearKey()">Clear</button>
    </div>

    <p style="font-size:14px;margin-top:10px;">
      This app uses Groq to generate your rant scripts.  
      Your API key is stored only in your browser.  
      <br><br>
      👉 <a href="https://console.groq.com/keys" target="_blank">Get your Groq API key</a>
    </p>
  </div>

  <!-- BOTTOM AD -->
  <div class="ads-box">
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-client="ca-pub-6610889405997257"
         data-ad-slot="2468135790"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

</div>


<!-- JAVASCRIPT -->
<script>
/* Dark/Light Mode */
const toggle = document.getElementById("modeToggle");
toggle.onclick = () => {
  document.body.classList.toggle("dark");
  toggle.textContent = document.body.classList.contains("dark") ? "Light" : "Dark";
};

/* API KEY MANAGEMENT */
function saveKey() {
  localStorage.setItem("groqApiKey", apiKeyInput.value);
  alert("API key saved!");
}
function clearKey() {
  localStorage.removeItem("groqApiKey");
  apiKeyInput.value = "";
  alert("API key cleared!");
}
function toggleKey() {
  apiKeyInput.type = apiKeyInput.type === "password" ? "text" : "password";
}
window.onload = () => {
  const saved = localStorage.getItem("groqApiKey");
  if (saved) apiKeyInput.value = saved;
};

/* GENERATE RANT */
async function generateRant() {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) return alert("Enter your Groq API key.");

  const payload = {
    topic: topic.value,
    style: style.value,
    script: userScript.value,
    voice: voice.value,
    meltdown: meltdown.value,
    paragraphs: paragraphs.value,
    slang: slang.checked,
    swearing: swearing.checked
  };

  const res = await fetch(
    "https://faceless-rant-proxy.bouncingstephen.workers.dev/api",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": apiKey
      },
      body: JSON.stringify(payload)
    }
  );

  const data = await res.json();
  output.value = data.rant || "No response received.";
}
</script>

</body>
</html>
