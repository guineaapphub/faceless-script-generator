<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google AdSense Verification -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6610889405997257"
          crossorigin="anonymous"></script>

  <title>Faceless Script Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      transition: background-color 0.3s;
    }

    body.dark {
      background-color: #111;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }

    body.dark .container {
      background: #1c1c1c;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      transition: border 0.3s;
    }

    body.dark input {
      background: #222;
      color: white;
      border: 2px solid #444;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.25s;
    }

    body.dark button {
      background: #222;
      color: white;
      border: 2px solid #444;
    }

    button:hover {
      background: #eaeaea;
    }

    body.dark button:hover {
      background: #333;
    }

    #api-output {
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      color: green;
    }

    /* Dropdown (Show / Hide) */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      padding: 10px 18px;
      font-size: 16px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      width: 100px;
      text-align: center;
    }

    body.dark .dropdown-btn {
      background: #222;
      color: white;
      border: 2px solid #444;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      width: 100px;
      margin-top: 5px;
      z-index: 10;
    }

    body.dark .dropdown-content {
      background: #222;
      border: 2px solid #444;
    }

    .dropdown-content div {
      padding: 10px;
      cursor: pointer;
      text-align: center;
    }

    .dropdown-content div:hover {
      background: #eaeaea;
    }

    body.dark .dropdown-content div:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Groq API Key</h1>

    <h2>Your Groq API key</h2>

    <input id="apiKeyInput" type="password" placeholder="Enter your Groq API key" />

    <div id="api-output"></div>

    <br>

    <div class="button-row">

      <!-- SHOW / HIDE DROPDOWN -->
      <div class="dropdown">
        <button class="dropdown-btn" id="toggleDropdown">Show</button>
        <div class="dropdown-content" id="dropdownMenu">
          <div onclick="setVisibility(true)">Show</div>
          <div onclick="setVisibility(false)">Hide</div>
        </div>
      </div>

      <button id="saveBtn">Save</button>
      <button id="clearBtn">Clear</button>
    </div>

    <p style="margin-top:30px; font-size:14px;">
      This app uses <b>Groq</b> to generate your rant scripts.  
      Your API key is stored only in your browser (local storage).  
      You can create a free key here:
    </p>

    <a href="https://console.groq.com/keys" target="_blank">
      👉 Get your Groq API key
    </a>

  </div>

  <script>
    // Dropdown show/hide
    const dropdownBtn = document.getElementById("toggleDropdown");
    const dropdownMenu = document.getElementById("dropdownMenu");
    const apiKeyInput = document.getElementById("apiKeyInput");

    dropdownBtn.onclick = () => {
      dropdownMenu.style.display =
        dropdownMenu.style.display === "block" ? "none" : "block";
    };

    function setVisibility(show) {
      apiKeyInput.type = show ? "text" : "password";
      dropdownBtn.textContent = show ? "Hide" : "Show";
      dropdownMenu.style.display = "none";
    }

    // Save API key
    document.getElementById("saveBtn").onclick = () => {
      localStorage.setItem("groqApiKey", apiKeyInput.value);
      document.getElementById("api-output").textContent = "API key saved!";
    };

    // Clear API key
    document.getElementById("clearBtn").onclick = () => {
      localStorage.removeItem("groqApiKey");
      apiKeyInput.value = "";
      document.getElementById("api-output").textContent = "API key cleared!";
    };

    // Load stored key
    window.onload = () => {
      const savedKey = localStorage.getItem("groqApiKey");
      if (savedKey) apiKeyInput.value = savedKey;
    };
  </script>
</body>
</html>
